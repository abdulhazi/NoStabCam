name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          unzip -q -o "$ZIP" -d src
          DIR=$(dirname "$(find src -name gradlew -type f | head -n 1)")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NoStabCam.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NoStabCam-apk
          path: NoStabCam.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NoStab Cam build ${{ github.run_number }}
          files: NoStabCam.apk
